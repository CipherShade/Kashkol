// ===== STUDENT EXAM-TAKING FLOW (phone lookup -> questions -> submit) =====
function ExamTakeScreen({ examId, onExit }) {
  const { t, lang } = useLang();
  const data = useData();
  const toast = useToast();
  const exam = data.exams.find((x) => x.id === examId);
  const [phase, setPhase] = useState("identify"); // identify | taking | done
  const [phone, setPhone] = useState("");
  const [student, setStudent] = useState(null);
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);

  if (!exam) return (
    <div className="screen"><EmptyState icon={I("file", { size: 22 })} title={t("exam_not_found")} /></div>
  );

  function identify(e) {
    e.preventDefault();
    const norm = (s) => String(s || "").replace(/[^0-9]/g, "");
    const found = data.students.find((s) => norm(s.phone) === norm(phone) || norm(s.parentPhone) === norm(phone));
    if (!found) { toast(t("exam_not_found")); return; }
    setStudent(found);
    setPhase("taking");
  }

  function submit() {
    let auto = 0, manual = false;
    exam.questions.forEach((q) => {
      if (q.type === "essay") { manual = true; return; }
      if (answers[q.id] === q.correct) auto += q.points;
    });
    data.submitExamAttempt(exam.id, student.id, answers, auto, manual);
    setResult({ auto, manual });
    setPhase("done");
  }

  if (phase === "identify") {
    return (
      <div className="auth-shell" style={{ gridTemplateColumns: "1fr" }}>
        <div className="auth-form-area">
          <div className="auth-card">
            <h2>{exam.title}</h2>
            <p className="auth-card-sub">{t("exam_enter_phone")}</p>
            <form onSubmit={identify} style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 14 }}>
              <Input label={t("col_phone")} value={phone} onChange={(e) => setPhone(e.target.value)} dir="ltr" placeholder="01xxxxxxxxx" required />
              <Button type="submit" className="auth-submit">{t("exam_identify")}</Button>
            </form>
            <p className="auth-switch"><a onClick={onExit}>{t("topbar_back_to_app")}</a></p>
          </div>
        </div>
      </div>
    );
  }

  if (phase === "done") {
    return (
      <div className="auth-shell" style={{ gridTemplateColumns: "1fr" }}>
        <div className="auth-form-area">
          <div className="auth-card" style={{ textAlign: "center" }}>
            <div className="empty-icon" style={{ margin: "0 auto 12px" }}>{I("check", { size: 24 })}</div>
            <h2>{t("exam_submitted")}</h2>
            <p className="auth-card-sub">{student.firstName} {student.lastName}</p>
            {exam.showAfter && (
              <div className="big-metric" style={{ marginTop: 16 }}>{result.auto} / {exam.questions.reduce((s, q) => s + q.points, 0)}</div>
            )}
            {result.manual && <p className="cell-muted mt8">{t("exam_essay_pending")}</p>}
            <Button className="mt16" variant="secondary" onClick={onExit}>{t("topbar_back_to_app")}</Button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="screen" style={{ maxWidth: 720, margin: "0 auto" }}>
      <div className="screen-head">
        <div>
          <h1>{exam.title}</h1>
          <p className="screen-sub">{t("exam_hello")} {student.firstName} {student.lastName} · {exam.durationMin} {t("exam_duration")}</p>
        </div>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 14, marginTop: 16 }}>
        {exam.questions.map((q, i) => (
          <Card key={q.id}>
            <div className="teach-card-top">
              <span className="badge tone-primary">{i + 1}</span>
              <span className="cell-muted">{q.points} {t("exam_points")}</span>
            </div>
            <div className="teach-card-title">{q.text}</div>
            <div className="mt16" style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {q.type === "essay" ? (
                <Textarea rows={4} value={answers[q.id] || ""} onChange={(e) => setAnswers((a) => ({ ...a, [q.id]: e.target.value }))} placeholder={t("exam_question_text")} />
              ) : (
                q.options.map((opt) => (
                  <button
                    key={opt}
                    className={"comm-type-btn" + (answers[q.id] === opt ? " comm-type-btn-active" : "")}
                    style={{ textAlign: "start" }}
                    onClick={() => setAnswers((a) => ({ ...a, [q.id]: opt }))}
                  >{opt}</button>
                ))
              )}
            </div>
          </Card>
        ))}

function MeetingRoom({ meetingId, onExit }) {
  const { t } = useLang();
  const data = useData();
  const meeting = data.meetings.find((x) => x.id === meetingId);
  const [muted, setMuted] = useState(false);
  const [camOn, setCamOn] = useState(true);
  const [share, setShare] = useState(false);
  const [hand, setHand] = useState(false);
  const [msg, setMsg] = useState("");
  const chatEnd = useRef(null);

  useEffect(() => {
    if (chatEnd.current) chatEnd.current.scrollIntoView({ behavior: "smooth" });
  }, [meeting && meeting.chat.length]);

  if (!meeting) return <div className="screen"><EmptyState icon={I("globe", { size: 22 })} title={t("meetings_title")} /></div>;
  const g = data.groupById(meeting.groupId);
  const roster = g ? data.studentsInGroup(g.id).slice(0, 6) : [];

  function send() {
    if (!msg.trim()) return;
    data.addMeetingMessage(meeting.id, { id: "c" + Date.now(), who: data.currentUser, text: msg.trim(), time: new Date().toTimeString().slice(0, 5) });
    setMsg("");
  }

  return (
    <div className="screen">
      <button className="back-link" onClick={onExit}>{I("chevronLeft", { size: 16 })}{t("meetings_title")}</button>
      <div className="screen-head">
        <div>
          <h1>{meeting.title}</h1>
          <p className="screen-sub">{g ? g.name : ""} · <Badge tone="danger" dot>{t("meeting_status_live")}</Badge></p>
        </div>
        <Button variant="secondary" onClick={() => { data.setMeetingStatus(meeting.id, "ended"); onExit(); }}>{t("meeting_end")}</Button>
      </div>

      <div className="comm-layout" style={{ marginTop: 16 }}>
        <div>
          <div style={{ position: "relative", background: "#0F1418", borderRadius: "var(--radius-lg)", aspectRatio: "16/9", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
            <div style={{ textAlign: "center", color: "#EDEEE9" }}>
              <Avatar name={(data.currentUser || "A").slice(0, 1).toUpperCase()} size={72} tint="var(--primary)" />
              <p style={{ marginTop: 10 }}>{data.currentUser} {share ? "· " + t("meeting_share") : ""}</p>
            </div>
            <div style={{ position: "absolute", bottom: 12, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center" }}>
              <button className={"mark-btn" + (muted ? " mark-btn-active mark-absent" : "")} onClick={() => setMuted((v) => !v)}>{I("phone", { size: 15 })}{" "}{muted ? t("meeting_mute") : t("meeting_mute")}</button>
              <button className={"mark-btn" + (!camOn ? " mark-btn-active mark-absent" : "")} onClick={() => setCamOn((v) => !v)}>{I("globe", { size: 15 })}{" "}{t("meeting_cam_off")}</button>
              <button className={"mark-btn" + (share ? " mark-btn-active mark-present" : "")} onClick={() => setShare((v) => !v)}>{I("file", { size: 15 })}{" "}{t("meeting_share")}</button>
              <button className={"mark-btn" + (hand ? " mark-btn-active mark-late" : "")} onClick={() => setHand((v) => !v)}>{I("alert", { size: 15 })}{" "}{t("meeting_hand")}</button>
              <button className="mark-btn" onClick={onExit}>{I("logout", { size: 15 })}{" "}{t("meeting_leave")}</button>
            </div>
          </div>
          <Card title={t("meeting_participants") + " (" + (roster.length + 1) + ")"} className="mt16">
            <div className="attention-mini-list">
              <div className="attention-mini-row">
                <Avatar name="Y" size={30} tint="var(--primary)" />
                <div className="attention-mini-main"><div className="attention-mini-name">{t("meeting_you")}</div></div>
                {hand && <Badge tone="warn">{t("meeting_hand")}</Badge>}
              </div>
              {roster.map((s) => (
                <div className="attention-mini-row" key={s.id}>
                  <Avatar name={initials(s)} size={30} />
                  <div className="attention-mini-main"><div className="attention-mini-name">{s.firstName} {s.lastName}</div></div>
                </div>
              ))}
              {roster.length === 0 && <p className="cell-muted">{t("meeting_waiting")}</p>}
            </div>
          </Card>
        </div>

        <Card title={t("meeting_chat")}>
          <div style={{ maxHeight: 360, overflowY: "auto", display: "flex", flexDirection: "column", gap: 8 }}>
            {meeting.chat.map((c) => (
              <div key={c.id} className="note-item">
                <div className="note-date">{c.who} · {c.time}</div>
                <div>{c.text}</div>
              </div>
            ))}
            <div ref={chatEnd} />
          </div>
          <div className="mt16" style={{ display: "flex", gap: 8 }}>
            <input className="field-input" style={{ flex: 1 }} value={msg} onChange={(e) => setMsg(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder={t("meeting_msg_placeholder")} />
            <Button size="sm" onClick={send}>{t("action_send")}</Button>
          </div>
        </Card>
      </div>
    </div>
  );
}

function CreateExamModal({ open, onClose }) {
  const { t } = useLang();
  const data = useData();
  const toast = useToast();
  const [title, setTitle] = useState("");
  const [groupId, setGroupId] = useState(data.groups[0]?.id);
  const [durationMin, setDurationMin] = useState(45);
  const [showAfter, setShowAfter] = useState(true);
  const [questions, setQuestions] = useState([
    { id: "q1", type: "mcq", text: "", options: ["", "", "", ""], correct: "", points: 5 },
  ]);

  useEffect(() => {
    if (open) {
      setTitle(""); setGroupId(data.groups[0]?.id); setDurationMin(45); setShowAfter(true);
      setQuestions([{ id: "q1", type: "mcq", text: "", options: ["", "", "", ""], correct: "", points: 5 }]);
    }
    // eslint-disable-next-line
  }, [open]);

  function updateQ(id, patch) {
    setQuestions((qs) => qs.map((q) => (q.id === id ? { ...q, ...patch } : q)));
  }
  function addQ() {
    setQuestions((qs) => [...qs, { id: "q" + Date.now(), type: "mcq", text: "", options: ["", "", "", ""], correct: "", points: 5 }]);
  }
  function removeQ(id) {
    setQuestions((qs) => qs.filter((q) => q.id !== id));
  }
  function changeType(id, type) {
    updateQ(id, { type, options: type === "tf" ? ["True", "False"] : type === "essay" ? [] : ["", "", "", ""], correct: "" });
  }

  function submit(e) {
    e.preventDefault();
    const cleaned = questions.filter((q) => q.text.trim()).map((q) => ({ ...q, options: q.options.filter((o) => String(o).trim()) }));
    if (!title.trim() || cleaned.length === 0) { toast(t("exams_add")); return; }
    data.addExam({ title, groupId, durationMin: Number(durationMin), showAfter, questions: cleaned });
    toast(t("toast_saved"));
    onClose();
  }

  return (
    <Modal open={open} onClose={onClose} title={t("exams_add")} width={640}>
      <form onSubmit={submit} className="modal-form">
        <Input label={t("exam_title_field")} value={title} onChange={(e) => setTitle(e.target.value)} required />
        <div className="form-row-2">
          <Select label={t("exam_group")} value={groupId} onChange={(e) => setGroupId(e.target.value)}>
            {data.groups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
          </Select>
          <Input label={t("exam_duration")} type="number" min="5" value={durationMin} onChange={(e) => setDurationMin(e.target.value)} />
        </div>
        <label className="check-row">
          <input type="checkbox" checked={showAfter} onChange={(e) => setShowAfter(e.target.checked)} />
          <span>{t("exam_show_after")}</span>
        </label>

        <div className="modal-section-title">{t("exam_questions")}</div>
        {questions.map((q, i) => (
          <div className="exam-q-editor" key={q.id}>
            <div className="exam-q-head">
              <span className="badge tone-primary">{i + 1}</span>
              <Select value={q.type} onChange={(e) => changeType(q.id, e.target.value)}>
                <option value="mcq">{t("exam_type_mcq")}</option>
                <option value="tf">{t("exam_type_tf")}</option>
                <option value="essay">{t("exam_type_essay")}</option>
              </Select>
              <Input label=" " type="number" min="1" value={q.points} onChange={(e) => updateQ(q.id, { points: Number(e.target.value) })} style={{ maxWidth: 90 }} />
              {questions.length > 1 && <button type="button" className="link-btn link-danger" onClick={() => removeQ(q.id)}>{t("action_delete")}</button>}
            </div>
            <Input label={t("exam_question_text")} value={q.text} onChange={(e) => updateQ(q.id, { text: e.target.value })} />
            {q.type !== "essay" && (
              <div className="exam-q-options">
                {q.options.map((opt, oi) => (
                  <input key={oi} className="field-input" value={opt} placeholder={t("exam_options") + " " + (oi + 1)}
                    onChange={(e) => { const next = q.options.slice(); next[oi] = e.target.value; updateQ(q.id, { options: next }); }} />
                ))}
                <Select label={t("exam_correct")} value={q.correct} onChange={(e) => updateQ(q.id, { correct: e.target.value })}>
                  <option value="">—</option>
                  {q.options.filter((o) => String(o).trim()).map((o, oi) => <option key={oi} value={o}>{o}</option>)}
                </Select>
              </div>
            )}
          </div>
        ))}
        <Button type="button" variant="secondary" icon={I("plus", { size: 15 })} onClick={addQ}>{t("exam_add_question")}</Button>

        <div className="modal-actions">
          <Button type="button" variant="secondary" onClick={onClose}>{t("action_cancel")}</Button>
          <Button type="submit">{t("action_create")}</Button>
        </div>
      </form>
    </Modal>
  );
}

function UploadFileModal({ open, onClose }) {
  const { t } = useLang();
  const data = useData();
  const toast = useToast();
  const [name, setName] = useState("");
  const [scope, setScope] = useState("personal");
  const [groupId, setGroupId] = useState(data.groups[0]?.id);
  const [studentId, setStudentId] = useState(data.students[0]?.id);
  const fileInput = useRef(null);

  useEffect(() => { if (open) { setName(""); setScope("personal"); } }, [open]);

  function onPick(e) {
    const f = e.target.files && e.target.files[0];
    if (f) setName(f.name);
    e.target.value = "";
  }

  function submit(e) {
    e.preventDefault();
    const finalName = name.trim() || t("files_upload") + ".pdf";
    data.addFile({ name: finalName, scope, groupId: scope === "group" ? groupId : null, studentId: scope === "student" ? studentId : null });
    toast(t("toast_saved"));
    onClose();
  }
  return (
    <Modal open={open} onClose={onClose} title={t("files_upload")}>
      <form onSubmit={submit} className="modal-form">
        <Input label={t("files_name")} value={name} onChange={(e) => setName(e.target.value)} placeholder="material.pdf" />
        <input ref={fileInput} type="file" accept="application/pdf" onChange={onPick} />
        <Select label={t("files_scope")} value={scope} onChange={(e) => setScope(e.target.value)}>
          <option value="personal">{t("files_scope_personal")}</option>
          <option value="group">{t("files_scope_group")}</option>
          <option value="student">{t("files_scope_student")}</option>
        </Select>
        {scope === "group" && (
          <Select label={t("files_target_group")} value={groupId} onChange={(e) => setGroupId(e.target.value)}>
            {data.groups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
          </Select>
        )}
        {scope === "student" && (
          <Select label={t("files_target_student")} value={studentId} onChange={(e) => setStudentId(e.target.value)}>
            {data.students.map((s) => <option key={s.id} value={s.id}>{s.firstName} {s.lastName}</option>)}
          </Select>
        )}
        <div className="modal-actions">
          <Button type="button" variant="secondary" onClick={onClose}>{t("action_cancel")}</Button>
          <Button type="submit">{t("action_create")}</Button>
        </div>
      </form>
    </Modal>
  );
}

function AddTeamMemberModal({ open, onClose }) {
  const { t } = useLang();
  const data = useData();
  const toast = useToast();
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [role, setRole] = useState("assistant");
  const [permissions, setPermissions] = useState({ students: true, grades: true, attendance: true, finance: false, settings: false });
  const perms = ["students", "grades", "attendance", "finance", "settings"];

  useEffect(() => { if (open) { setName(""); setEmail(""); setRole("assistant"); setPermissions({ students: true, grades: true, attendance: true, finance: false, settings: false }); } }, [open]);

  function submit(e) {
    e.preventDefault();
    if (!name.trim()) return;
    data.addTeamMember({ name, email, role, permissions: role === "owner" ? { students: true, grades: true, attendance: true, finance: true, settings: true } : permissions });
    toast(t("toast_saved"));
    onClose();
  }
  return (
    <Modal open={open} onClose={onClose} title={t("team_add")}>
      <form onSubmit={submit} className="modal-form">
        <Input label={t("team_name")} value={name} onChange={(e) => setName(e.target.value)} required />
        <Input label={t("team_email")} type="email" value={email} onChange={(e) => setEmail(e.target.value)} dir="ltr" />
        <Select label={t("team_role")} value={role} onChange={(e) => setRole(e.target.value)}>
          <option value="assistant">{t("role_assistant")}</option>
          <option value="owner">{t("role_owner")}</option>
        </Select>
        {role !== "owner" && (
          <div>
            <div className="modal-section-title">{t("team_access")}</div>
            <div className="perm-checks">
              {perms.map((p) => (
                <label className="check-row" key={p}>
                  <input type="checkbox" checked={!!permissions[p]} onChange={() => setPermissions((prev) => ({ ...prev, [p]: !prev[p] }))} />
                  <span>{t("team_perm_" + p)}</span>
                </label>
              ))}
            </div>
          </div>
        )}
        <div className="modal-actions">
          <Button type="button" variant="secondary" onClick={onClose}>{t("action_cancel")}</Button>
          <Button type="submit">{t("action_create")}</Button>
        </div>
      </form>
    </Modal>
  );
}

function ContactParentModal({ open, onClose, student }) {
  const { t, lang } = useLang();
  const [type, setType] = useState("attendance");
  const [message, setMessage] = useState("");

  useEffect(() => {
    if (open && student) setMessage(buildMessage(type, t, student, null));
    // eslint-disable-next-line
  }, [open, type, student]);

  if (!student) return null;
  const phone = student.parentPhone;
  function openWhatsapp() {
    const num = (phone || "").replace(/[^0-9]/g, "");
    window.open("https://wa.me/2" + num + "?text=" + encodeURIComponent(message), "_blank", "noopener");
  }
  return (
    <Modal open={open} onClose={onClose} title={t("profile_message_parent") + " — " + student.firstName + " " + student.lastName} width={560}>
      <div className="comm-type-grid">
        {["attendance", "homework", "quiz", "report", "custom"].map((mt) => (
          <button key={mt} className={cx("comm-type-btn", type === mt && "comm-type-btn-active")} onClick={() => setType(mt)}>{t("comm_type_" + mt)}</button>
        ))}
      </div>
      <Textarea className="mt16" rows={6} value={message} onChange={(e) => setMessage(e.target.value)} />
      <p className="cell-muted mt8" dir="ltr">{phone}</p>
      <div className="modal-actions">
        <Button type="button" variant="secondary" onClick={onClose}>{t("action_close")}</Button>
        <Button icon={I("whatsapp", { size: 15 })} onClick={openWhatsapp}>{t("comm_open_whatsapp")}</Button>
      </div>
    </Modal>
  );
}

// ===== APP ROOT =====
function AppShell() {
  const { t } = useLang();
  const data = useData();
  const [authScreen, setAuthScreen] = useState("login"); // login | signup | app
  const [view, setView] = useState("dashboard");
  const [mobileOpen, setMobileOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [notifOpen, setNotifOpen] = useState(false);
  const [selectedStudentId, setSelectedStudentId] = useState(null);
  const [modal, setModal] = useState(null); // { name, payload }
  const [commPresetStudent, setCommPresetStudent] = useState(null);
  const [previewExamId, setPreviewExamId] = useState(null);
  const [examResultsExam, setExamResultsExam] = useState(null);
  const [meetingRoomId, setMeetingRoomId] = useState(null);

  function openModal(name, payload) {
    if (name === "contactParent") {
      setModal({ name: "contactParent", payload });
      return;
    }
    if (name === "editStudent") {
      setModal({ name: "addStudent", payload });
      return;
    }
    if (name === "examResults") {
      setExamResultsExam(payload);
      return;
    }
    setModal({ name, payload });
  }
  function closeModal() { setModal(null); }

  function goView(v) {
    setSelectedStudentId(null);
    setQuery("");
    setPreviewExamId(null);
    setExamResultsExam(null);
    setMeetingRoomId(null);
    setView(v);
  }

  if (authScreen === "login") return <LoginScreen onLogin={() => setAuthScreen("app")} goSignup={() => setAuthScreen("signup")} />;
  if (authScreen === "signup") return <SignupScreen onSignup={() => setAuthScreen("app")} goLogin={() => setAuthScreen("login")} />;
  if (previewExamId) return <ExamTakeScreen examId={previewExamId} onExit={() => setPreviewExamId(null)} />;
  if (examResultsExam) return <ExamResultsScreen exam={examResultsExam} onBack={() => setExamResultsExam(null)} setView={goView} />;

  return (
    <div className="app-root">
      <Sidebar view={view} setView={goView} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} teacherName={data.teacherName} />
      <div className="app-main">
        <Topbar
          setMobileOpen={setMobileOpen}
          query={query} setQuery={setQuery}
          notifOpen={notifOpen} setNotifOpen={setNotifOpen}
          notifications={data.notifications}
          onMarkAllRead={data.markAllNotifRead}
          view={view} setView={goView}
        />
        <main className="app-content">
          {view === "dashboard" && <DashboardScreen setView={goView} setSelectedStudentId={setSelectedStudentId} openModal={openModal} />}
          {view === "students" && <StudentsScreen selectedStudentId={selectedStudentId} setSelectedStudentId={setSelectedStudentId} openModal={openModal} setView={goView} query={query} />}
          {view === "groups" && <GroupsScreen openModal={openModal} query={query} setView={goView} setSelectedStudentId={setSelectedStudentId} />}
          {view === "sessions" && <SessionsScreen openModal={openModal} setView={goView} />}
          {view === "attendance" && <AttendanceScreen />}
          {view === "homework" && <HomeworkScreen openModal={openModal} />}
          {view === "quizzes" && <QuizzesScreen openModal={openModal} />}
          {view === "results" && <ResultsScreen />}
          {view === "online_exams" && <OnlineExamsScreen openModal={openModal} setView={goView} setPreviewExamId={setPreviewExamId} />}
          {view === "meetings" && <MeetingsScreen openModal={openModal} meetingRoomId={meetingRoomId} setMeetingRoomId={setMeetingRoomId} />}
          {view === "files" && <FilesScreen openModal={openModal} />}
          {view === "team" && <TeamScreen />}
          {view === "audit" && <AuditScreen />}
          {view === "reports" && <ReportsScreen setView={goView} setSelectedStudentId={setSelectedStudentId} />}
          {view === "attention" && <AttentionScreen setView={goView} setSelectedStudentId={setSelectedStudentId} openModal={openModal} />}
          {view === "parents" && <CommunicationScreen presetStudentId={commPresetStudent} openModal={openModal} />}
          {view === "student_portal" && <StudentPortalScreen />}
          {view === "parent_portal" && <ParentPortalScreen />}
          {view === "settings" && <SettingsScreen />}
        </main>
      </div>

      <AddStudentModal open={modal?.name === "addStudent"} onClose={closeModal} initial={modal?.payload} />
      <CreateGroupModal open={modal?.name === "createGroup"} onClose={closeModal} />
      <CreateSessionModal open={modal?.name === "createSession"} onClose={closeModal} initial={modal?.payload} />
      <AddHomeworkModal open={modal?.name === "addHomework"} onClose={closeModal} />
      <CreateQuizModal open={modal?.name === "createQuiz"} onClose={closeModal} />
      <ContactParentModal open={modal?.name === "contactParent"} onClose={closeModal} student={modal?.payload} />
      <CreateExamModal open={modal?.name === "createExam"} onClose={closeModal} />
      <CreateMeetingModal open={modal?.name === "createMeeting"} onClose={closeModal} />
      <UploadFileModal open={modal?.name === "uploadFile"} onClose={closeModal} />
    </div>
  );
}

function App() {
  return (
    <LangProvider>
      <ToastProvider>
        <DataProvider>
          <AppShell />
        </DataProvider>
      </ToastProvider>
    </LangProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
