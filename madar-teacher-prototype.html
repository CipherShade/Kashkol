<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Madar — نظام إدارة المدرسين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
/* ===== TOKENS ===== */
:root {
  --bg: #EFF0EA;
  --surface: #FFFFFF;
  --surface-2: #F7F7F2;
  --ink: #191D1B;
  --muted: #6E7168;
  --muted-2: #93958C;
  --border: #E2E1D6;
  --border-strong: #CFCEC0;
  --primary: #1F4C4A;
  --primary-strong: #163837;
  --primary-tint: #E4EDEC;
  --accent: #E0A039;
  --accent-strong: #B97F1F;
  --accent-tint: #FBF0DD;
  --success: #3C7A5B;
  --success-tint: #E4F0E8;
  --danger: #B9483E;
  --danger-tint: #F8E6E3;
  --warn: #B97F1F;
  --warn-tint: #FBF0DD;
  --shadow-1: 0 1px 2px rgba(25, 29, 27, 0.06);
  --shadow-2: 0 6px 20px rgba(25, 29, 27, 0.08);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-ui: 'Manrope', 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-display: 'Fraunces', 'Cairo', Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171A;
    --surface: #1C2023;
    --surface-2: #22262A;
    --ink: #EDEEE9;
    --muted: #9EA29A;
    --muted-2: #767A72;
    --border: #2C3033;
    --border-strong: #3A3F42;
    --primary: #4E9B92;
    --primary-strong: #6CB6AC;
    --primary-tint: #1E2F2E;
    --accent: #E7B45C;
    --accent-strong: #F0C87D;
    --accent-tint: #2E2517;
    --success: #6BAE8B;
    --success-tint: #1B2C22;
    --danger: #E17C71;
    --danger-tint: #331F1D;
    --warn: #E7B45C;
    --warn-tint: #2E2517;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171A; --surface: #1C2023; --surface-2: #22262A; --ink: #EDEEE9;
  --muted: #9EA29A; --muted-2: #767A72; --border: #2C3033; --border-strong: #3A3F42;
  --primary: #4E9B92; --primary-strong: #6CB6AC; --primary-tint: #1E2F2E;
  --accent: #E7B45C; --accent-strong: #F0C87D; --accent-tint: #2E2517;
  --success: #6BAE8B; --success-tint: #1B2C22; --danger: #E17C71; --danger-tint: #331F1D;
  --warn: #E7B45C; --warn-tint: #2E2517; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  font-size: 14.5px;
  line-height: 1.5;
}
html[lang="ar"] body { font-family: 'Cairo', var(--font-ui); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3 { font-family: 'Cairo', var(--font-ui); font-weight: 700; letter-spacing: 0; }
p { margin: 0; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
a { cursor: pointer; color: var(--primary); }
::selection { background: var(--accent-tint); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.icon { flex-shrink: 0; }
.mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; }

/* ===== AUTH ===== */
.auth-shell { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); }
.auth-side {
  background: var(--primary); color: #F4F6F1; padding: 56px;
  display: flex; flex-direction: column; justify-content: center; gap: 18px;
  background-image: radial-gradient(circle at 85% 15%, rgba(255,255,255,0.08), transparent 45%);
}
.auth-side-mark { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; }
.auth-side-title { font-family: var(--font-display); font-size: 34px; margin: 0; }
html[lang="ar"] .auth-side-title { font-family: 'Cairo', var(--font-ui); }
.auth-side-tag { font-size: 16px; opacity: 0.82; max-width: 360px; }
.auth-side-stats { display: flex; gap: 32px; margin-top: 24px; }
.auth-stat-num { font-family: var(--font-display); font-size: 26px; }
html[lang="ar"] .auth-stat-num { font-family: 'Cairo', var(--font-ui); }
.auth-stat-label { font-size: 12.5px; opacity: 0.75; margin-top: 2px; }
.auth-form-area { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; position: relative; }
.auth-form-top { position: absolute; inset-inline-end: 28px; top: 24px; }
.auth-card { width: 100%; max-width: 380px; }
.auth-card h2 { font-size: 24px; }
.auth-card-sub { color: var(--muted); margin-top: 6px; font-size: 14px; }
.auth-card form { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
.auth-submit { width: 100%; justify-content: center; margin-top: 4px; }
.auth-demo-btn { width: 100%; justify-content: center; margin-top: 10px; }
.auth-switch { margin-top: 18px; font-size: 13.5px; color: var(--muted); text-align: center; }
.auth-switch a { text-decoration: underline; margin-inline-start: 4px; }
@media (max-width: 860px) { .auth-shell { grid-template-columns: 1fr; } .auth-side { display: none; } }

/* ===== APP SHELL ===== */
.app-root { display: flex; min-height: 100vh; }
.sidebar {
  width: 252px; flex-shrink: 0; background: var(--surface); border-inline-end: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
}
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px 16px; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.brand-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
html[lang="ar"] .brand-name { font-family: 'Cairo', var(--font-ui); }
.brand-sub { font-size: 11.5px; color: var(--muted); }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 4px 12px; }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
.nav-group { margin-bottom: 14px; }
.nav-group-label { font-size: 11px; font-weight: 700; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 10px 6px; }
html[lang="ar"] .nav-group-label { text-transform: none; }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: var(--radius-sm);
  background: transparent; border: none; color: var(--ink); font-size: 13.8px; text-align: start;
}
.nav-item:hover { background: var(--surface-2); }
.nav-item-active { background: var(--primary-tint); color: var(--primary-strong); font-weight: 600; }
.nav-item-active .icon { color: var(--primary-strong); }

.app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 22px;
  border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 20;
}
.topbar-burger { display: none; }
.topbar-search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.topbar-search input { flex: 1; border: none; background: none; outline: none; }
.topbar-search-icon { color: var(--muted-2); flex-shrink: 0; }
.topbar-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
.lang-switch { display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 600; }
.lang-switch:hover { background: var(--surface-2); }
.app-content { flex: 1; padding: 22px 26px 60px; max-width: 1280px; width: 100%; margin: 0 auto; }

.sidebar-scrim { display: none; }
@media (max-width: 980px) {
  .sidebar { position: fixed; inset-inline-start: 0; top: 0; z-index: 50; transform: translateX(-100%); transition: transform 0.2s ease; box-shadow: var(--shadow-2); }
  html[dir="rtl"] .sidebar { transform: translateX(100%); }
  .sidebar-open { transform: translateX(0); }
  .topbar-burger { display: flex; }
  .app-content { padding: 16px 14px 40px; }
  .sidebar-scrim { display: block; position: fixed; inset: 0; background: rgba(20,22,20,0.4); z-index: 45; }
}

/* ===== ICON BUTTON / POPOVER ===== */
.icon-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); border-color: var(--border); }
.notif-wrap { position: relative; }
.notif-badge { position: absolute; top: 2px; inset-inline-end: 2px; background: var(--danger); color: #fff; font-size: 9.5px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
.popover { position: absolute; top: calc(100% + 8px); inset-inline-end: 0; width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-2); z-index: 40; }
.popover-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13.5px; }
.notif-list { max-height: 360px; overflow-y: auto; }
.notif-row { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border); }
.notif-row:last-child { border-bottom: none; }
.notif-unread { background: var(--primary-tint); }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.notif-text { font-size: 13px; }
.notif-time { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* ===== BUTTONS ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; white-space: nowrap; transition: background .12s ease, border-color .12s ease; }
.btn-md { padding: 9px 16px; font-size: 13.8px; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-strong); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border-strong); }
.btn-secondary:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-icon-only { padding: 8px; }

/* ===== BADGE ===== */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.badge.tone-success { background: var(--success-tint); color: var(--success); }
.badge.tone-warn { background: var(--warn-tint); color: var(--warn); }
.badge.tone-danger { background: var(--danger-tint); color: var(--danger); }
.badge.tone-primary { background: var(--primary-tint); color: var(--primary-strong); }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ===== CARD ===== */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 0; }
.card-title { font-size: 15px; font-weight: 700; font-family: var(--font-ui); }
.card-body { padding: 14px 18px 18px; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 16px; }
.dash-span-2 { grid-column: span 2; }
@media (max-width: 760px) { .dash-grid { grid-template-columns: 1fr; } .dash-span-2 { grid-column: span 1; } }

/* ===== SCREEN HEAD ===== */
.screen { }
.screen-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.screen-head h1 { font-size: 24px; }
.screen-sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.back-link { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 12px; padding: 0; }
.back-link:hover { color: var(--ink); }

/* ===== STAT CARDS ===== */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
@media (max-width: 760px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; }
.stat-top { display: flex; align-items: center; justify-content: space-between; }
.stat-icon { color: var(--primary); }
.stat-sub { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.stat-value { font-family: var(--font-display); font-size: 26px; margin-top: 10px; }
html[lang="ar"] .stat-value { font-family: 'Cairo', var(--font-ui); }
.stat-label { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* ===== QUICK ACTIONS ===== */
.quick-actions { margin-top: 18px; }
.quick-actions-label { font-size: 11.5px; font-weight: 700; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.05em; }
html[lang="ar"] .quick-actions-label { text-transform: none; }
.quick-actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.qa-btn { display: flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 600; }
.qa-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }

/* ===== SESSION LIST/ROWS ===== */
.session-list { display: flex; flex-direction: column; gap: 8px; }
.session-row { display: flex; align-items: center; gap: 12px; padding: 9px; border-radius: 10px; border: 1px solid var(--border); }
.session-row-time { font-size: 12.5px; font-weight: 700; padding: 5px 9px; border-inline-start: 2.5px solid var(--primary); background: var(--surface-2); border-radius: 6px; white-space: nowrap; }
.session-row-main { flex: 1; min-width: 0; }
.session-row-title { font-weight: 600; font-size: 13.8px; }
.session-row-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

/* ===== ATTENTION MINI LIST ===== */
.attention-mini-list { display: flex; flex-direction: column; gap: 4px; }
.attention-mini-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; border: none; background: none; width: 100%; text-align: start; }
.attention-mini-row:hover { background: var(--surface-2); }
.attention-mini-main { flex: 1; min-width: 0; }
.attention-mini-name { font-weight: 600; font-size: 13.5px; }
.attention-mini-reason { font-size: 12px; color: var(--muted); }

/* ===== DEADLINES ===== */
.deadline-list { display: flex; flex-direction: column; gap: 4px; }
.deadline-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--border); }
.deadline-row:last-child { border-bottom: none; }
.deadline-icon { color: var(--muted-2); flex-shrink: 0; }
.deadline-main { flex: 1; min-width: 0; }
.deadline-title { font-size: 13.3px; font-weight: 600; }
.deadline-sub { font-size: 11.8px; color: var(--muted); }
.deadline-date { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* ===== FILTER ROW / FIELDS ===== */
.filter-row { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.field-label { font-weight: 600; color: var(--muted); font-size: 12.5px; }
.field-input { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); outline: none; }
.field-input:focus { border-color: var(--primary); }
textarea.field-input { resize: vertical; font-family: inherit; }
.select-wrap { position: relative; }
.select-wrap select { appearance: none; width: 100%; padding-inline-end: 30px; }
.select-caret { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

/* ===== TABLE ===== */
.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data-table th { text-align: start; padding: 11px 18px; font-size: 11.5px; font-weight: 700; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
html[lang="ar"] .data-table th { text-transform: none; }
.data-table td { padding: 11px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.clickable-row { cursor: pointer; }
.clickable-row:hover { background: var(--surface-2); }
.cell-person { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.cell-muted { color: var(--muted); }
.cell-pct { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.cell-pct span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.perm-table th, .perm-table td { text-align: center; }
.perm-table th:first-child, .perm-table td:first-child { text-align: start; }
.perm-cell svg { margin: 0 auto; }

/* ===== AVATAR ===== */
.avatar { border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }

/* ===== EMPTY STATE ===== */
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 30px 14px; color: var(--muted); }
.empty-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; margin-bottom: 10px; color: var(--muted-2); }
.empty-title { font-weight: 600; color: var(--ink); font-size: 13.8px; }
.empty-sub { font-size: 12.5px; margin-top: 3px; }

/* ===== PROGRESS ===== */
.progress-track { flex: 1; height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 4px; }
.tone-bg-primary { background: var(--primary); }
.tone-bg-success { background: var(--success); }
.tone-bg-warn { background: var(--warn); }
.tone-bg-danger { background: var(--danger); }
.tone-text-success { color: var(--success); }
.tone-text-warn { color: var(--warn); }
.tone-text-danger { color: var(--danger); }
.tone-text-muted { color: var(--muted-2); }

/* ===== CHARTS ===== */
.mini-chart { width: 100%; display: block; }

/* ===== TABS ===== */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-top: 14px; overflow-x: auto; }
.tab { padding: 9px 4px; margin-inline-end: 20px; background: none; border: none; border-bottom: 2px solid transparent; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab-active { color: var(--primary-strong); border-color: var(--primary); }

/* ===== PROFILE HEAD ===== */
.profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
.profile-head-main { flex: 1; min-width: 200px; }
.profile-head h1 { font-size: 21px; }
.profile-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kv-list { display: flex; flex-direction: column; gap: 9px; }
.kv-row { display: flex; align-items: center; justify-content: space-between; font-size: 13.3px; }
.kv-row span { color: var(--muted); }
.big-metric { font-family: var(--font-display); font-size: 34px; margin-bottom: 8px; }
html[lang="ar"] .big-metric { font-family: 'Cairo', var(--font-ui); }

/* ===== NOTES ===== */
.note-composer { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.notes-list { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.note-item { padding: 10px 12px; background: var(--surface-2); border-radius: 8px; font-size: 13.3px; }
.note-date { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }

/* ===== GROUPS ===== */
.group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; }
.group-card { text-align: start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.group-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); }
.group-card-top { display: flex; align-items: center; gap: 8px; }

<body>
<div id="root"></div>
<script type="text/plain" id="app-source">
// ===== MOCK DATA =====
const SUBJECTS = ["Physics", "Chemistry", "Math", "Biology", "English"];

const FIRST_NAMES_M = ["Ahmed","Mohamed","Omar","Youssef","Karim","Mahmoud","Ali","Hassan","Khaled","Mostafa","Amr","Tarek","Sherif","Adham","Ziad","Marwan","Seif","Hussein","Yassin","Belal"];
const FIRST_NAMES_F = ["Nour","Mariam","Salma","Habiba","Yasmin","Farida","Malak","Rana","Aya","Laila","Jana","Nada","Hana","Dina","Sara","Menna","Rawan","Reem","Fatma","Ola"];
const LAST_NAMES = ["Mohamed","Ahmed","Hassan","Mahmoud","Ali","Ibrahim","Mostafa","Abdel Rahman","El Sayed","Kamal","Adel","Fathy","Gamal","El Shazly","Nabil","Ezzat","Saad","Hosny","Fawzy","Shokry"];

function seedName(i) {
  const isM = i % 2 === 0;
  const first = (isM ? FIRST_NAMES_M : FIRST_NAMES_F)[i % 20];
  const last = LAST_NAMES[(i * 3) % 20];
  return { first, last, gender: isM ? "m" : "f" };
}

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(7788);

function buildGroups() {
  const groups = [];
  let gid = 1;
  SUBJECTS.slice(0, 4).forEach((subj, si) => {
    const slots = [
      { day: "sat", time: "16:00" },
      { day: "mon", time: "16:00" },
      { day: "sat", time: "19:00" },
      { day: "mon", time: "19:00" },
    ];
    const n = si === 0 ? 4 : si === 1 ? 3 : 2;
    for (let k = 0; k < n; k++) {
      groups.push({
        id: "g" + gid,
        name: subj + " — " + (k === 0 ? "Saturday 4 PM" : k === 1 ? "Monday 4 PM" : k === 2 ? "Saturday 7 PM" : "Monday 7 PM"),
        subject: subj,
        grade: "Grade 12",
        day: slots[k % 4].day,
        time: slots[k % 4].time,
        room: "Room " + (1 + (gid % 3)),
        color: ["#1F4C4A", "#8A5A2B", "#3C6E8F", "#6B4E9B"][si % 4],
      });
      gid++;
    }
  });
  return groups;
}
const GROUPS = buildGroups();

function buildStudents() {
  const students = [];
  for (let i = 0; i < 64; i++) {
    const { first, last, gender } = seedName(i);
    const group = GROUPS[Math.floor(rng() * GROUPS.length)];
    const attendancePct = Math.round(55 + rng() * 45);
    const consecutiveAbsences = attendancePct < 65 ? Math.floor(rng() * 5) + 2 : rng() < 0.15 ? Math.floor(rng() * 2) + 1 : 0;
    let status = "active";
    if (consecutiveAbsences >= 4 || attendancePct < 60) status = "inactive";
    else if (consecutiveAbsences >= 2 || attendancePct < 75) status = "at_risk";
    const quizAvg = Math.round(50 + rng() * 50);
    const trend = rng() < 0.3 ? "down" : rng() < 0.6 ? "up" : "flat";
    students.push({
      id: "s" + (i + 1),
      firstName: first,
      lastName: last,
      nameAr: null,
      gender,
      grade: "Grade 12 — Thanaweya Amma",
      groupId: group.id,
      phone: "01" + (1 + Math.floor(rng() * 2)) + Math.floor(10000000 + rng() * 89999999),
      parentName: (gender === "m" ? "Mr. " : "Mrs. ") + last,
      parentPhone: "01" + (1 + Math.floor(rng() * 2)) + Math.floor(10000000 + rng() * 89999999),
      joinDate: "2025-0" + (1 + (i % 9)) + "-" + (10 + (i % 18)),
      attendancePct,
      consecutiveAbsences,
      status,
      quizAvg,
      trend,
      homeworkCompletion: Math.round(45 + rng() * 55),
      notes: [],
    });
  }
  return students;
}
const STUDENTS = buildStudents();

function initials(s) {
  return (s.firstName[0] + s.lastName[0]).toUpperCase();
}

// Sessions: generate for current and next 2 weeks based on group day/time
const DAY_MAP = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
function buildSessions() {
  const sessions = [];
  const today = new Date();
  let sid = 1;
  for (let w = -1; w < 3; w++) {
    GROUPS.forEach((g) => {
      const base = new Date(today);
      const targetDow = DAY_MAP[g.day];
      const diff = (targetDow - base.getDay() + 7) % 7;
      base.setDate(base.getDate() + diff + w * 7);
      const dateStr = base.toISOString().slice(0, 10);
      const roster = STUDENTS.filter((s) => s.groupId === g.id);
      sessions.push({
        id: "sess" + sid++,
        groupId: g.id,
        date: dateStr,
        time: g.time,
        status: base < today ? "completed" : base.toDateString() === today.toDateString() ? "today" : "upcoming",
        rosterCount: roster.length,
        attendanceTaken: base < today,
      });
    });
  }
  return sessions;
}
const SESSIONS = buildSessions();

// Attendance records for completed sessions
function buildAttendance() {
  const records = {};
  SESSIONS.filter((s) => s.attendanceTaken).forEach((sess) => {
    const roster = STUDENTS.filter((s) => s.groupId === sess.groupId);
    records[sess.id] = {};
    roster.forEach((st) => {
      const r = rng();
      let mark = "present";
      if (st.status === "inactive" && r < 0.5) mark = "absent";
      else if (st.status === "at_risk" && r < 0.3) mark = "absent";
      else if (r < 0.08) mark = "late";
      else if (r < 0.12) mark = "excused";
      else if (r < 0.18) mark = "absent";
      records[sess.id][st.id] = mark;
    });
  });
  return records;
}
const ATTENDANCE = buildAttendance();

function buildHomework() {
  const items = [];
  let hid = 1;
  GROUPS.forEach((g, i) => {
    for (let k = 0; k < 2; k++) {
      const roster = STUDENTS.filter((s) => s.groupId === g.id);
      const submitted = roster.filter(() => rng() < 0.7).map((s) => s.id);
      items.push({
        id: "hw" + hid++,
        groupId: g.id,
        title: g.subject + " Worksheet " + (k + 1),
        dueDate: "2026-09-" + (10 + k * 6 + (i % 5)),
        assignedCount: roster.length,
        submittedIds: submitted,
      });
    }
  });
  return items;
}
const HOMEWORK = buildHomework();

function buildQuizzes() {
  const items = [];
  let qid = 1;
  GROUPS.forEach((g, i) => {
    const roster = STUDENTS.filter((s) => s.groupId === g.id);
    const results = {};
    roster.forEach((s) => { results[s.id] = Math.round(40 + rng() * 60); });
    items.push({
      id: "q" + qid++,
      groupId: g.id,
      title: g.subject + " — Chapter " + (2 + (i % 5)) + " Quiz",
      date: "2026-09-" + (5 + (i % 12)),
      maxScore: 100,
      results,
    });
  });
  return items;
}
const QUIZZES = buildQuizzes();

const NOTIFICATIONS = [
  { id: "n1", type: "risk", textKey: "notif_risk", meta: "Ahmed Mohamed", time: "9:12 AM", read: false },
  { id: "n2", type: "homework", textKey: "notif_hw_low", meta: "Chemistry — Saturday 7 PM", time: "8:40 AM", read: false },
  { id: "n3", type: "session", textKey: "notif_session_soon", meta: "Physics — Monday 4 PM", time: "Yesterday", read: true },
  { id: "n4", type: "quiz", textKey: "notif_quiz_ready", meta: "Math — Chapter 4 Quiz", time: "2 days ago", read: true },
];

// ===== ONLINE EXAMS =====
function buildExams() {
  const exams = [];
  GROUPS.slice(0, 3).forEach((g, i) => {
    const roster = STUDENTS.filter((s) => s.groupId === g.id);
    const attempts = {};
    roster.slice(0, Math.ceil(roster.length * 0.6)).forEach((s) => {
      attempts[s.id] = {
        answers: {}, submittedAt: "2026-09-" + (10 + i) + " 18:00",
        autoScore: Math.round(40 + rng() * 60), manualPending: false, total: Math.round(40 + rng() * 60),
      };
    });
    exams.push({
      id: "ex" + (i + 1),
      title: g.subject + " — Online Exam " + (i + 1),
      groupId: g.id,
      durationMin: 45,
      start: "2026-09-" + (8 + i) + "T16:00",
      end: "2026-09-" + (15 + i) + "T23:59",
      showAfter: true,
      shareCode: "MAD-" + (1000 + i),
      status: "open",
      questions: [
        { id: "q1", type: "mcq", text: "Which of the following is correct?", options: ["Option A", "Option B", "Option C", "Option D"], correct: "Option A", points: 5 },
        { id: "q2", type: "tf", text: "This statement is true.", options: ["True", "False"], correct: "True", points: 3 },

// ===== ONLINE MEETINGS =====
function buildMeetings() {
  const meetings = [];
  const today = new Date();
  const iso = (d) => d.toISOString().slice(0, 10);
  GROUPS.slice(0, 3).forEach((g, i) => {
    const d = new Date(today); d.setDate(d.getDate() + i);
    meetings.push({
      id: "mt" + (i + 1),
      groupId: g.id,
      title: g.name + " — Live Session",
      date: iso(d),
      time: i === 0 ? "16:00" : "18:00",
      status: i === 0 ? "live" : "scheduled",
      joinCode: "madar-" + g.subject.toLowerCase().replace(/[^a-z]/g, "") + "-" + (100 + i),
      chat: [
        { id: "c1", who: "Sara Hassan", text: "Good evening everyone!", time: "16:02" },
      ],
    });
  });
  return meetings;
}

function cx(...a) { return a.filter(Boolean).join(" "); }

function Avatar({ name, size = 36, tint }) {
  const colors = ["#1F4C4A", "#8A5A2B", "#3C6E8F", "#6B4E9B", "#B0592C", "#3C8562"];
  const c = tint || colors[(name.charCodeAt(0) + name.length) % colors.length];
  return (
    <div className="avatar" style={{ width: size, height: size, background: c, fontSize: size * 0.4 }}>
      {name}
    </div>
  );
}

function Badge({ tone = "default", children, dot }) {
  return (
    <span className={"badge tone-" + tone}>
      {dot && <span className="badge-dot" />}
      {children}
    </span>
  );
}

function Button({ variant = "primary", size = "md", children, icon, iconOnly, className, ...rest }) {
  return (
    <button className={cx("btn", "btn-" + variant, "btn-" + size, iconOnly && "btn-icon-only", className)} {...rest}>
      {icon}
      {!iconOnly && <span>{children}</span>}
    </button>
  );
}

function Card({ title, action, children, className, padded = true }) {
  return (
    <div className={cx("card", className)}>
      {(title || action) && (
        <div className="card-head">
          {title && <h3 className="card-title">{title}</h3>}
          {action}
        </div>
      )}
      <div className={padded ? "card-body" : ""}>{children}</div>
    </div>
  );
}

function Input({ label, className, ...rest }) {
  return (
    <label className={cx("field", className)}>
      {label && <span className="field-label">{label}</span>}
      <input className="field-input" {...rest} />
    </label>
  );
}

function Textarea({ label, className, ...rest }) {
  return (
    <label className={cx("field", className)}>
      {label && <span className="field-label">{label}</span>}
      <textarea className="field-input" {...rest} />
    </label>
  );
}

function Select({ label, className, children, ...rest }) {
  return (
    <label className={cx("field", className)}>
      {label && <span className="field-label">{label}</span>}
      <div className="select-wrap">
        <select className="field-input" {...rest}>{children}</select>
        {I("chevronDown", { size: 15, className: "select-caret" })}
      </div>

function Modal({ open, onClose, title, children, width }) {
  if (!open) return null;
  return (
    <div className="modal-backdrop" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-panel" style={width ? { maxWidth: width } : undefined}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="icon-btn" onClick={onClose} aria-label="Close">{I("x", { size: 18 })}</button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function Tabs({ tabs, active, onChange }) {
  return (
    <div className="tabs" role="tablist">
      {tabs.map((t) => (
        <button key={t.key} role="tab" aria-selected={active === t.key}
          className={cx("tab", active === t.key && "tab-active")}
          onClick={() => onChange(t.key)}>
          {t.label}
        </button>
      ))}
    </div>
  );
}

function EmptyState({ icon, title, sub, action }) {
  return (
    <div className="empty-state">
      <div className="empty-icon">{icon}</div>
      <p className="empty-title">{title}</p>
      {sub && <p className="empty-sub">{sub}</p>}
      {action}
    </div>
  );
}

function StatCard({ label, value, sub, tone, iconName }) {
  return (
    <div className="stat-card">
      <div className="stat-top">
        <span className="stat-icon">{I(iconName, { size: 17 })}</span>
        {sub && <span className={cx("stat-sub", tone && "tone-text-" + tone)}>{sub}</span>}
      </div>
      <div className="stat-value">{value}</div>
      <div className="stat-label">{label}</div>
    </div>
  );
}

// Simple horizontal bar chart (SVG), values 0-100
function BarChart({ data, height = 150 }) {
  const max = 100;
  const barW = 100 / data.length;
  return (
    <svg viewBox={`0 0 100 ${height}`} preserveAspectRatio="none" className="mini-chart" style={{ height }}>
      {data.map((d, i) => {
        const h = (d.value / max) * (height - 26);
        return (
          <g key={i}>
            <rect x={i * barW + barW * 0.2} y={height - 20 - h} width={barW * 0.6} height={h} rx="1.4" fill={d.color || "var(--primary)"} opacity={d.dim ? 0.35 : 1} />
            <text x={i * barW + barW * 0.5} y={height - 6} textAnchor="middle" fontSize="6.2" fill="var(--muted)">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

// Simple line/area sparkline
function LineChart({ data, height = 140, color = "var(--primary)" }) {
  const max = 100, min = 0;
  const w = 100;
  const step = w / (data.length - 1 || 1);
  const pts = data.map((d, i) => [i * step, height - 22 - ((d.value - min) / (max - min)) * (height - 34)]);
  const path = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = path + ` L${pts[pts.length - 1][0]},${height - 22} L${pts[0][0]},${height - 22} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" className="mini-chart" style={{ height }}>
      <path d={area} fill={color} opacity="0.1" />
      <path d={path} fill="none" stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="1.4" fill={color} />)}
      {data.map((d, i) => <text key={i} x={pts[i][0]} y={height - 6} textAnchor="middle" fontSize="6.2" fill="var(--muted)">{d.label}</text>)}
    </svg>
  );
}

function ProgressBar({ pct, tone = "primary" }) {
  return (
    <div className="progress-track">
      <div className={"progress-fill tone-bg-" + tone} style={{ width: Math.min(100, Math.max(0, pct)) + "%" }} />
    </div>
  );
}

function statusTone(status) {
  return status === "active" ? "success" : status === "at_risk" ? "warn" : "danger";
}

// ===== TOASTS =====
const ToastCtx = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, msg }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2600);
  }, []);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-stack">
        {toasts.map((t) => (
          <div key={t.id} className="toast">{I("check", { size: 15 })}<span>{t.msg}</span></div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
function useToast() { return useContext(ToastCtx); }
// ===== DATA STORE =====
const DataCtx = createContext(null);

function loadPersisted() {
  try {
    const raw = localStorage.getItem("ots_state_v1");
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function DataProvider({ children }) {
  const persisted = useMemo(loadPersisted, []);
  const [students, setStudents] = useState(persisted?.students || STUDENTS);
  const [groups, setGroups] = useState(persisted?.groups || GROUPS);
  const [sessions, setSessions] = useState(persisted?.sessions || SESSIONS);
  const [attendance, setAttendance] = useState(persisted?.attendance || ATTENDANCE);
  const [homework, setHomework] = useState(persisted?.homework || HOMEWORK);
  const [quizzes, setQuizzes] = useState(persisted?.quizzes || QUIZZES);
  const [notifications, setNotifications] = useState(persisted?.notifications || NOTIFICATIONS);
  const [thresholds, setThresholds] = useState(persisted?.thresholds || { atRisk: 2, inactive: 4 });
  const [teacherName, setTeacherName] = useState(persisted?.teacherName || "Ahmed Physics");
  const [exams, setExams] = useState(persisted?.exams || EXAMS);
  const [meetings, setMeetings] = useState(persisted?.meetings || MEETINGS);
  const [files, setFiles] = useState(persisted?.files || FILES);
  const [team, setTeam] = useState(persisted?.team || TEAM);
  const [audit, setAudit] = useState(persisted?.audit || AUDIT_SEED);
  const [currentUser, setCurrentUser] = useState(persisted?.currentUser || "Ahmed Hassan");

  function logAction(actionKey, target) {
    setAudit((prev) => [
      { id: "a" + Date.now() + Math.random().toString(36).slice(2, 5), actor: currentUser, actionKey, target, time: "Just now" },
      ...prev,
    ].slice(0, 200));
  }

  useEffect(() => {
    try {
      localStorage.setItem("ots_state_v1", JSON.stringify({
        students, groups, sessions, attendance, homework, quizzes, notifications, thresholds, teacherName,
        exams, meetings, files, team, audit, currentUser,
      }));
    } catch (e) {}
  }, [students, groups, sessions, attendance, homework, quizzes, notifications, thresholds, teacherName, exams, meetings, files, team, audit, currentUser]);

  function restoreState(obj) {
    if (!obj) return;
    if (obj.students) setStudents(obj.students);
    if (obj.groups) setGroups(obj.groups);
    if (obj.sessions) setSessions(obj.sessions);
    if (obj.attendance) setAttendance(obj.attendance);
    if (obj.homework) setHomework(obj.homework);
    if (obj.quizzes) setQuizzes(obj.quizzes);
    if (obj.notifications) setNotifications(obj.notifications);
    if (obj.thresholds) setThresholds(obj.thresholds);
    if (obj.teacherName) setTeacherName(obj.teacherName);
    if (obj.exams) setExams(obj.exams);
    if (obj.meetings) setMeetings(obj.meetings);
    if (obj.files) setFiles(obj.files);
    if (obj.team) setTeam(obj.team);
    if (obj.audit) setAudit(obj.audit);
    if (obj.currentUser) setCurrentUser(obj.currentUser);
  }

  function importStudents(rows) {
    const base = Date.now();
    const mapped = rows.map((r, i) => {
      const group = groups.find((g) => g.name === r.groupName) || groups[0];
      const parts = String(r.name || "New Student").trim().split(" ");
      return {
        id: "imp" + base + i, firstName: parts[0] || "New", lastName: parts.slice(1).join(" ") || "",
        gender: "m", grade: "Grade 12 — Thanaweya Amma", groupId: group ? group.id : null,
        phone: String(r.phone || ""), parentName: "", parentPhone: String(r.parentPhone || ""),
        joinDate: todayISO(), attendancePct: 100, consecutiveAbsences: 0, status: "active",
        quizAvg: 0, trend: "flat", homeworkCompletion: 0, notes: [],
      };
    });
    setStudents((s) => [...mapped, ...s]);
    logAction("audit_action_import", String(mapped.length));
    return mapped.length;
  }

  const groupById = useCallback((id) => groups.find((g) => g.id === id), [groups]);
  const studentById = useCallback((id) => students.find((s) => s.id === id), [students]);
  const studentsInGroup = useCallback((id) => students.filter((s) => s.groupId === id), [students]);

  const recomputeStatus = useCallback((student) => {
    if (student.consecutiveAbsences >= thresholds.inactive) return "inactive";
    if (student.consecutiveAbsences >= thresholds.atRisk) return "at_risk";
    return "active";
  }, [thresholds]);

  function addStudent(data) {
    const id = "s" + (Date.now());
    const rec = {
      id, firstName: data.firstName, lastName: data.lastName, gender: "m",
      grade: "Grade 12 — Thanaweya Amma", groupId: data.groupId,
      phone: data.phone || "010", parentName: data.parentName || "", parentPhone: data.parentPhone || "",
      joinDate: new Date().toISOString().slice(0, 10), attendancePct: 100, consecutiveAbsences: 0,
      status: "active", quizAvg: 0, trend: "flat", homeworkCompletion: 0, notes: [],
    };
    setStudents((s) => [rec, ...s]);
    logAction("audit_action_add_student", (data.firstName || "") + " " + (data.lastName || ""));
    return rec;
  }

  function addGroup(data) {
    const id = "g" + Date.now();
    const rec = { id, name: data.name, subject: data.subject, grade: "Grade 12", day: data.day, time: data.time, room: data.room || "Room 1", color: "#1F4C4A" };
    setGroups((g) => [rec, ...g]);
    return rec;
  }

  function addSession(data) {
    const id = "sess" + Date.now();
    const roster = studentsInGroup(data.groupId);
    const rec = { id, groupId: data.groupId, date: data.date, time: data.time, status: "upcoming", rosterCount: roster.length, attendanceTaken: false };
    setSessions((s) => [rec, ...s]);
    logAction("audit_action_add_session", (groupById(data.groupId) || {}).name || "");
    return rec;
  }

  function cancelSession(id) {
    setSessions((s) => s.filter((x) => x.id !== id));
  }

  function saveAttendance(sessionId, marks) {
    setAttendance((a) => ({ ...a, [sessionId]: marks }));
    setSessions((s) => s.map((x) => (x.id === sessionId ? { ...x, attendanceTaken: true, status: "completed" } : x)));
    // update student stats
    setStudents((prev) => prev.map((st) => {
      if (!(st.id in marks)) return st;
      const mark = marks[st.id];
      let consecutive = st.consecutiveAbsences;
      if (mark === "absent") consecutive += 1;
      else if (mark === "present" || mark === "late") consecutive = 0;
      const newStatus = consecutive >= thresholds.inactive ? "inactive" : consecutive >= thresholds.atRisk ? "at_risk" : "active";
      return { ...st, consecutiveAbsences: consecutive, status: newStatus };
    }));
    const sess = sessions.find((x) => x.id === sessionId);
    logAction("audit_action_save_attendance", sess ? ((groupById(sess.groupId) || {}).name || "") : "");
  }

  function addHomework(data) {
    const id = "hw" + Date.now();
    const roster = studentsInGroup(data.groupId);
    const rec = { id, groupId: data.groupId, title: data.title, dueDate: data.dueDate, assignedCount: roster.length, submittedIds: [] };
    setHomework((h) => [rec, ...h]);
    logAction("audit_action_add_homework", data.title || "");
    return rec;
  }

  function addQuiz(data) {
    const id = "q" + Date.now();
    const roster = studentsInGroup(data.groupId);
    const results = {};
    roster.forEach((s) => { results[s.id] = null; });
    const rec = { id, groupId: data.groupId, title: data.title, date: data.date, maxScore: data.maxScore || 100, results };
    setQuizzes((q) => [rec, ...q]);
    logAction("audit_action_add_quiz", data.title || "");
    return rec;
  }

  function setQuizScore(quizId, studentId, score) {
    setQuizzes((qs) => qs.map((q) => (q.id === quizId ? { ...q, results: { ...q.results, [studentId]: score } } : q)));
    const st = studentById(studentId);
    logAction("audit_action_quiz_score", st ? (st.firstName + " " + st.lastName) : "");
  }

  // ===== ONLINE EXAMS =====
  function addExam(data) {
    const id = "ex" + Date.now();
    const rec = {
      id, title: data.title, groupId: data.groupId, durationMin: data.durationMin || 30,
      start: data.start || todayISO() + "T00:00", end: data.end || todayISO() + "T23:59",
      showAfter: data.showAfter !== false, shareCode: "MAD-" + Math.floor(1000 + Math.random() * 9000),
      status: "open", questions: data.questions || [], attempts: {},
    };
    setExams((e) => [rec, ...e]);
    logAction("audit_action_add_exam", data.title || "");
    return rec;
  }
  function updateExam(id, patch) {
    setExams((e) => e.map((x) => (x.id === id ? { ...x, ...patch } : x)));
  }
  function submitExamAttempt(examId, studentId, answers, autoScore, manualPending) {
    setExams((e) => e.map((x) => (x.id === examId ? {
      ...x,
      attempts: { ...x.attempts, [studentId]: { answers, submittedAt: new Date().toISOString(), autoScore, total: autoScore, manualPending } },
    } : x)));
  }
  function setExamManualScore(examId, studentId, total) {
    setExams((e) => e.map((x) => (x.id === examId ? {
      ...x,
      attempts: { ...x.attempts, [studentId]: { ...(x.attempts[studentId] || {}), total, manualPending: false } },
    } : x)));
  }

  // ===== MEETINGS =====
  function addMeeting(data) {
    const id = "mt" + Date.now();
    const g = groupById(data.groupId);
    const rec = {
      id, groupId: data.groupId, title: data.title || ((g ? g.name : "") + " — Live Session"),
      date: data.date || todayISO(), time: data.time || "16:00", status: "scheduled",
      joinCode: "madar-" + id, chat: [],
    };
    setMeetings((m) => [rec, ...m]);
    return rec;
  }
  function setMeetingStatus(id, status) {
    setMeetings((m) => m.map((x) => (x.id === id ? { ...x, status } : x)));
  }
  function addMeetingMessage(id, msg) {
    setMeetings((m) => m.map((x) => (x.id === id ? { ...x, chat: [...x.chat, msg] } : x)));
  }

  // ===== FILES =====
  function addFile(data) {
    const id = "f" + Date.now();
    const rec = { id, name: data.name, size: data.size || "—", type: data.type || "pdf", scope: data.scope || "personal", groupId: data.groupId || null, studentId: data.studentId || null, date: todayISO() };
    setFiles((f) => [rec, ...f]);
    logAction("audit_action_add_file", data.name || "");
    return rec;
  }
  function removeFile(id) {
    setFiles((f) => f.filter((x) => x.id !== id));
  }

  // ===== TEAM =====
  function addTeamMember(data) {
    const id = "t" + Date.now();
    const rec = { id, name: data.name, email: data.email, role: data.role || "assistant", permissions: data.permissions || { students: true, grades: true, attendance: true, finance: false, settings: false } };
    setTeam((tm) => [...tm, rec]);
    return rec;
  }
  function toggleTeamPermission(id, key) {
    setTeam((tm) => tm.map((x) => (x.id === id ? { ...x, permissions: { ...x.permissions, [key]: !x.permissions[key] } } : x)));
  }
  function removeTeamMember(id) {
    setTeam((tm) => tm.filter((x) => x.id !== id));
  }

  function addNote(studentId, text) {
    setStudents((prev) => prev.map((s) => (s.id === studentId ? { ...s, notes: [{ text, date: new Date().toISOString().slice(0, 10) }, ...s.notes] } : s)));
  }

  function markAllNotifRead() {
    setNotifications((n) => n.map((x) => ({ ...x, read: true })));
  }

  const value = {
    students, groups, sessions, attendance, homework, quizzes, notifications, thresholds, teacherName,
    exams, meetings, files, team, audit, currentUser,
    setThresholds, setTeacherName, setCurrentUser,
    groupById, studentById, studentsInGroup,
    addStudent, addGroup, addSession, cancelSession, saveAttendance, addHomework, addQuiz, setQuizScore, addNote, markAllNotifRead,
    addExam, updateExam, submitExamAttempt, setExamManualScore,
    addMeeting, setMeetingStatus, addMeetingMessage,
    addFile, removeFile,
    addTeamMember, toggleTeamPermission, removeTeamMember,
    logAction, restoreState, importStudents,
  };
  return <DataCtx.Provider value={value}>{children}</DataCtx.Provider>;
}
function useData() { return useContext(DataCtx); }

function fmtDate(iso, lang) {
  try {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(lang === "ar" ? "ar-EG" : "en-GB", { day: "numeric", month: "short" });
  } catch (e) { return iso; }
}
function todayISO() { return new Date().toISOString().slice(0, 10); }

const LangCtx = createContext(null);
function LangProvider({ children }) {
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem("ots_lang") || "en"; } catch (e) { return "en"; }
  });
  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    try { localStorage.setItem("ots_lang", lang); } catch (e) {}
  }, [lang]);
  const t = useCallback((key) => (STR[lang] && STR[lang][key]) || STR.en[key] || key, [lang]);
  const dir = lang === "ar" ? "rtl" : "ltr";
  return <LangCtx.Provider value={{ lang, setLang, t, dir }}>{children}</LangCtx.Provider>;
}
function useLang() { return useContext(LangCtx); }

function DashboardScreen({ setView, setSelectedStudentId, openModal }) {
  const { t, lang } = useLang();
  const data = useData();
  const today = todayISO();

  const todaySessions = data.sessions.filter((s) => s.date === today).sort((a, b) => a.time.localeCompare(b.time));
  const upcoming = data.sessions.filter((s) => s.date > today).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).slice(0, 5);
  const expectedToday = todaySessions.reduce((sum, s) => sum + s.rosterCount, 0);

  const takenToday = todaySessions.filter((s) => data.attendance[s.id]);
  let presentToday = 0, totalMarkedToday = 0;
  takenToday.forEach((s) => {
    Object.values(data.attendance[s.id]).forEach((m) => { totalMarkedToday++; if (m === "present" || m === "late") presentToday++; });
  });
  const attendanceTodayPct = totalMarkedToday ? Math.round((presentToday / totalMarkedToday) * 100) : null;

  const deadlines = [
    ...data.homework.map((h) => ({ kind: "hw", label: h.title, date: h.dueDate, id: h.id, groupId: h.groupId })),
    ...data.quizzes.map((q) => ({ kind: "quiz", label: q.title, date: q.date, id: q.id, groupId: q.groupId })),
  ].filter((d) => d.date >= today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);

  const atRisk = data.students.filter((s) => s.status !== "active").sort((a, b) => b.consecutiveAbsences - a.consecutiveAbsences).slice(0, 4);

  const hour = new Date().getHours();
  const greetKey = hour < 12 ? "greeting_morning" : hour < 18 ? "greeting_afternoon" : "greeting_evening";

  const weekAttendance = useMemo(() => {
    const days = lang === "ar" ? ["سبت", "حد", "اثنين", "ثلاثاء", "أربع", "خميس", "جمعة"] : ["Sat", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri"];
    return days.map((label, i) => ({ label, value: Math.round(60 + ((i * 37) % 40)) }));
  }, [lang]);

  const hwCompletionAvg = Math.round(data.homework.reduce((s, h) => s + (h.assignedCount ? h.submittedIds.length / h.assignedCount : 0), 0) / (data.homework.length || 1) * 100);
  const quizAvgOverall = Math.round(data.students.reduce((s, st) => s + st.quizAvg, 0) / (data.students.length || 1));

  return (
    <div className="screen">
      <div className="screen-head">
        <div>
          <h1>{t(greetKey)}, Mona</h1>
          <p className="screen-sub">{t("dash_subtitle")}</p>
        </div>
      </div>

      <div className="stat-grid">
        <StatCard label={t("dash_expected_students")} value={expectedToday} iconName="users" />
        <StatCard label={t("dash_attendance_today")} value={attendanceTodayPct === null ? "—" : attendanceTodayPct + "%"} iconName="check" tone={attendanceTodayPct !== null && attendanceTodayPct < 75 ? "warn" : "success"} />
        <StatCard label={t("dash_homework_completion")} value={hwCompletionAvg + "%"} iconName="book" />
        <StatCard label={t("dash_quiz_avg")} value={quizAvgOverall} iconName="bar" />
      </div>

      <div className="quick-actions">
        <span className="quick-actions-label">{t("dash_quick_actions")}</span>
        <div className="quick-actions-row">
          <button className="qa-btn" onClick={() => openModal("addStudent")}>{I("plus", { size: 15 })}{t("qa_add_student")}</button>
          <button className="qa-btn" onClick={() => openModal("createSession")}>{I("calendar", { size: 15 })}{t("qa_create_session")}</button>
          <button className="qa-btn" onClick={() => setView("attendance")}>{I("check", { size: 15 })}{t("qa_take_attendance")}</button>
          <button className="qa-btn" onClick={() => openModal("addHomework")}>{I("book", { size: 15 })}{t("qa_add_homework")}</button>
          <button className="qa-btn" onClick={() => openModal("createQuiz")}>{I("edit3", { size: 15 })}{t("qa_create_quiz")}</button>
          <button className="qa-btn" onClick={() => setView("parents")}>{I("whatsapp", { size: 15 })}{t("qa_contact_parent")}</button>
        </div>
      </div>

      <div className="dash-grid">
        <Card title={t("dash_today_sessions")} className="dash-span-2">
          {todaySessions.length === 0 ? (
            <EmptyState icon={I("calendar", { size: 22 })} title={t("dash_no_sessions_today")} />
          ) : (
            <div className="session-list">
              {todaySessions.map((s) => {
                const g = data.groupById(s.groupId);
                return (
                  <div className="session-row" key={s.id}>
                    <div className="session-row-time" style={{ borderColor: g.color }}>{s.time}</div>
                    <div className="session-row-main">
                      <div className="session-row-title">{g.name}</div>
                      <div className="session-row-sub">{s.rosterCount} {t("session_students_expected")} · {g.room}</div>
                    </div>
                    <Button variant={s.attendanceTaken ? "secondary" : "primary"} size="sm" onClick={() => setView("attendance")}>
                      {s.attendanceTaken ? t("session_view_attendance") : t("session_take_attendance")}
                    </Button>
                  </div>
                );
              })}
            </div>
          )}
        </Card>

        <Card title={t("dash_needs_attention")} action={<button className="link-btn" onClick={() => setView("attention")}>{t("dash_view_all")}</button>}>
          {atRisk.length === 0 ? (
            <EmptyState icon={I("check", { size: 22 })} title={t("attention_none")} />
          ) : (
            <div className="attention-mini-list">
              {atRisk.map((s) => (
                <button key={s.id} className="attention-mini-row" onClick={() => { setSelectedStudentId(s.id); setView("students"); }}>
                  <Avatar name={initials(s)} size={30} />
                  <div className="attention-mini-main">
                    <div className="attention-mini-name">{s.firstName} {s.lastName}</div>
                    <div className="attention-mini-reason">
                      {s.consecutiveAbsences > 0 ? `${s.consecutiveAbsences} ${t("attention_reason_absences")}` : t("attention_reason_declining")}
                    </div>
                  </div>
                  <Badge tone={statusTone(s.status)}>{t("status_" + s.status)}</Badge>
                </button>
              ))}
            </div>
          )}
        </Card>

        <Card title={t("dash_weekly_attendance")}>
          <BarChart data={weekAttendance.map((d) => ({ ...d, color: "var(--primary)" }))} />
        </Card>

        <Card title={t("dash_upcoming")} action={<button className="link-btn" onClick={() => setView("sessions")}>{t("dash_view_all")}</button>}>
          <div className="session-list">
            {upcoming.map((s) => {
              const g = data.groupById(s.groupId);
              return (
                <div className="session-row" key={s.id}>
                  <div className="session-row-time" style={{ borderColor: g.color }}>{fmtDate(s.date, lang)}</div>
                  <div className="session-row-main">
                    <div className="session-row-title">{g.name}</div>
                    <div className="session-row-sub">{s.time} · {s.rosterCount} {t("session_students_expected")}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>

        <Card title={t("dash_deadlines")}>
          <div className="deadline-list">
            {deadlines.map((d) => {
              const g = data.groupById(d.groupId);
              return (
                <div className="deadline-row" key={d.kind + d.id}>
                  {I(d.kind === "hw" ? "book" : "edit3", { size: 15, className: "deadline-icon" })}
                  <div className="deadline-main">
                    <div className="deadline-title">{d.label}</div>
                    <div className="deadline-sub">{g?.name}</div>
                  </div>
                  <div className="deadline-date">{fmtDate(d.date, lang)}</div>
                </div>
              );
            })}
          </div>
        </Card>
      </div>
    </div>
  );
}

function StudentsScreen({ selectedStudentId, setSelectedStudentId, openModal, setView, query }) {
  const { t, lang } = useLang();
  const data = useData();
  const [groupFilter, setGroupFilter] = useState("all");
  const [statusFilter, setStatusFilter] = useState("all");

  const selected = selectedStudentId ? data.studentById(selectedStudentId) : null;
  if (selected) {
    return <StudentProfile student={selected} onBack={() => setSelectedStudentId(null)} openModal={openModal} setView={setView} />;
  }

  const q = (query || "").trim().toLowerCase();
  const filtered = data.students.filter((s) => {
    if (groupFilter !== "all" && s.groupId !== groupFilter) return false;
    if (statusFilter !== "all" && s.status !== statusFilter) return false;
    if (q && !(s.firstName + " " + s.lastName).toLowerCase().includes(q)) return false;
    return true;
  });

  return (
    <div className="screen">
      <div className="screen-head">
        <div>
          <h1>{t("students_title")}</h1>
          <p className="screen-sub">{data.students.length} {t("students_sub")}</p>
        </div>
        <Button icon={I("plus", { size: 15 })} onClick={() => openModal("addStudent")}>{t("students_add")}</Button>
      </div>

      <div className="filter-row">
        <Select value={groupFilter} onChange={(e) => setGroupFilter(e.target.value)}>
          <option value="all">{t("filter_all_groups")}</option>
          {data.groups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
        </Select>
        <Select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
          <option value="all">{t("filter_all_status")}</option>
          <option value="active">{t("status_active")}</option>
          <option value="at_risk">{t("status_at_risk")}</option>
          <option value="inactive">{t("status_inactive")}</option>
        </Select>
      </div>

      <Card padded={false}>
        {filtered.length === 0 ? (
          <div style={{ padding: "40px 20px" }}>
            <EmptyState icon={I("users", { size: 22 })} title={t("empty_students")} sub={t("empty_students_sub")} />
          </div>
        ) : (
          <div className="table-wrap">
            <table className="data-table">
              <thead>
                <tr>
                  <th>{t("col_name")}</th>
                  <th>{t("col_group")}</th>
                  <th>{t("col_attendance")}</th>
                  <th>{t("col_status")}</th>
                  <th>{t("col_quiz_avg")}</th>
                  <th>{t("col_parent")}</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((s) => {
                  const g = data.groupById(s.groupId);
                  return (
                    <tr key={s.id} className="clickable-row" onClick={() => setSelectedStudentId(s.id)}>
                      <td>
                        <div className="cell-person">
                          <Avatar name={initials(s)} size={30} />
                          <span>{s.firstName} {s.lastName}</span>
                        </div>
                      </td>
                      <td>{g?.name}</td>
                      <td>
                        <div className="cell-pct">
                          <ProgressBar pct={s.attendancePct} tone={s.attendancePct < 70 ? "danger" : s.attendancePct < 85 ? "warn" : "success"} />
                          <span>{s.attendancePct}%</span>
                        </div>
                      </td>
                      <td><Badge tone={statusTone(s.status)}>{t("status_" + s.status)}</Badge></td>
                      <td>{s.quizAvg}</td>
                      <td className="cell-muted">{s.parentName}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

// ===== SESSIONS =====
function startOfWeek(d) {
  const date = new Date(d);
  const day = date.getDay();
  date.setDate(date.getDate() - day);
  date.setHours(0, 0, 0, 0);
  return date;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function isoOf(d) { return d.toISOString().slice(0, 10); }

function SessionsScreen({ openModal, setView }) {
  const { t, lang } = useLang();
  const data = useData();
  const [weekOffset, setWeekOffset] = useState(0);
  const weekStart = addDays(startOfWeek(new Date()), weekOffset * 7);
  const days = Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  const dayKeys = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

  return (
    <div className="screen">
      <div className="screen-head">
        <div>
          <h1>{t("sessions_title")}</h1>
          <p className="screen-sub">{t("sessions_sub")}</p>
        </div>
        <Button icon={I("plus", { size: 15 })} onClick={() => openModal("createSession")}>{t("sessions_add")}</Button>
      </div>

      <div className="week-nav">
        <button className="icon-btn" onClick={() => setWeekOffset((w) => w - 1)}>{I(lang === "ar" ? "chevronRight" : "chevronLeft", { size: 17 })}</button>
        <span>{isoOf(days[0])} — {isoOf(days[6])}</span>
        <button className="icon-btn" onClick={() => setWeekOffset((w) => w + 1)}>{I(lang === "ar" ? "chevronLeft" : "chevronRight", { size: 17 })}</button>
        {weekOffset !== 0 && <button className="link-btn" onClick={() => setWeekOffset(0)}>{t("sessions_today")}</button>}
      </div>

      <div className="week-grid">
        {days.map((d, i) => {
          const iso = isoOf(d);
          const daySessions = data.sessions.filter((s) => s.date === iso).sort((a, b) => a.time.localeCompare(b.time));
          const isToday = iso === todayISO();
          return (
            <div className={cx("week-col", isToday && "week-col-today")} key={iso}>
              <div className="week-col-head">
                <span>{t("day_" + dayKeys[i])}</span>
                <span className="week-col-date">{d.getDate()}</span>
              </div>
              <div className="week-col-body">
                {daySessions.length === 0 && <div className="week-col-empty">—</div>}
                {daySessions.map((s) => {
                  const g = data.groupById(s.groupId);
                  return (
                    <div className="session-card" key={s.id} style={{ borderInlineStartColor: g.color }}>
                      <div className="session-card-time">{s.time}</div>
                      <div className="session-card-title">{g.name}</div>
                      <div className="session-card-meta">{s.rosterCount} {t("session_students_expected")}</div>
                      <div className="session-card-actions">
                        <button className="link-btn" onClick={() => setView("attendance")}>
                          {s.attendanceTaken ? t("session_view_attendance") : t("session_take_attendance")}
                        </button>
                        {!s.attendanceTaken && (
                          <button className="link-btn link-danger" onClick={() => data.cancelSession(s.id)}>{t("session_cancel")}</button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const MARKS = ["present", "absent", "late", "excused"];
function AttendanceScreen() {
  const { t, lang } = useLang();
  const data = useData();
  const toast = useToast();
  const upcomingAndToday = data.sessions.filter((s) => s.date <= addDaysISO(6)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const [activeSessionId, setActiveSessionId] = useState(() => {
    const todaySess = data.sessions.find((s) => s.date === todayISO());
    return todaySess ? todaySess.id : null;
  });
  const [marks, setMarks] = useState({});

  const activeSession = data.sessions.find((s) => s.id === activeSessionId);
  const roster = activeSession ? data.studentsInGroup(activeSession.groupId) : [];
  const existing = activeSession ? data.attendance[activeSession.id] : null;

  useEffect(() => {
    if (existing) setMarks(existing);
    else {
      const init = {};
      roster.forEach((s) => { init[s.id] = "present"; });
      setMarks(init);
    }
    // eslint-disable-next-line
  }, [activeSessionId]);

  function setMark(studentId, mark) {
    setMarks((m) => ({ ...m, [studentId]: mark }));
  }

  const list = data.sessions
    .filter((s) => s.date >= addDaysISO(-3))
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))
    .slice(0, 24);

  return (
    <div className="screen">
      <div className="screen-head">
        <div>
          <h1>{t("attendance_title")}</h1>
        </div>
      </div>
      <div className="attendance-layout">
        <Card title={t("attendance_pick_session")} padded={false} className="attendance-session-list">
          <div className="session-picker-list">
            {list.map((s) => {
              const g = data.groupById(s.groupId);
              return (
                <button key={s.id} className={cx("session-picker-row", activeSessionId === s.id && "session-picker-active")} onClick={() => setActiveSessionId(s.id)}>
                  <div className="group-color-dot" style={{ background: g.color }} />
                  <div className="session-picker-main">
                    <div>{g.name}</div>
                    <div className="cell-muted">{fmtDate(s.date, lang)} · {s.time}</div>
                  </div>
                  {s.attendanceTaken ? I("check", { size: 15, className: "tone-text-success" }) : (s.date === todayISO() ? <Badge tone="primary">{t("session_status_today")}</Badge> : null)}
                </button>
              );
            })}
          </div>
        </Card>

        <Card className="attendance-main" padded={activeSession ? false : true}>
          {!activeSession ? (
            <EmptyState icon={I("check", { size: 22 })} title={t("attendance_no_session")} />
          ) : (
            <>
              <div className="attendance-main-head">
                <div>
                  <div className="attendance-main-title">{data.groupById(activeSession.groupId).name}</div>
                  <div className="cell-muted">{fmtDate(activeSession.date, lang)} · {activeSession.time}</div>
                </div>
                <div className="attendance-main-actions">
                  <button className="link-btn" onClick={() => { const m = {}; roster.forEach((s) => (m[s.id] = "present")); setMarks(m); }}>{t("attendance_mark_all_present")}</button>
                  <Button size="sm" onClick={() => { data.saveAttendance(activeSession.id, marks); toast(t("attendance_saved")); }}>{t("attendance_save")}</Button>
                </div>
              </div>
              <div className="attendance-roster">
                {roster.map((s) => (
                  <div className="attendance-roster-row" key={s.id}>
                    <div className="cell-person"><Avatar name={initials(s)} size={30} /><span>{s.firstName} {s.lastName}</span></div>
                    <div className="mark-btn-group">
                      {MARKS.map((m) => (
                        <button key={m} className={cx("mark-btn", "mark-" + m, marks[s.id] === m && "mark-btn-active")} onClick={() => setMark(s.id, m)}>
                          {t("attendance_" + m)}

                      ))}

                  </div>
                ))}
              </div>
            </>

      if (s.trend === "down") reasons.push({ key: "attention_reason_declining" });
      if (s.homeworkCompletion < 55) reasons.push({ key: "attention_reason_low_hw" });

const MSG_TYPES = ["attendance", "homework", "quiz", "report", "custom", "announcement"];

function buildMessage(type, t, student, group) {
  const name = student ? student.firstName + " " + student.lastName : "";
  switch (type) {
    case "attendance":
      return `${name} — ${t("attendance_pct")}: ${student?.attendancePct}%. ${student?.consecutiveAbsences > 0 ? student.consecutiveAbsences + " " + t("attention_reason_absences") + "." : ""}`;
    case "homework":
      return `${t("homework_title")}: ${name} ${t("homework_due")}.`;
    case "quiz":
      return `${name} — ${t("col_quiz_avg")}: ${student?.quizAvg}/100.`;
    case "report":
      return `${t("reports_title")} — ${name}: ${t("attendance_pct")} ${student?.attendancePct}%, ${t("col_quiz_avg")} ${student?.quizAvg}.`;
    case "announcement":
      return `${group ? group.name : ""} — `;
    default:
      return "";
  }
}

function CommunicationScreen({ presetStudentId, openModal }) {
  const { t, lang } = useLang();
  const data = useData();
  const [type, setType] = useState("attendance");
  const [studentId, setStudentId] = useState(presetStudentId || data.students[0]?.id);
  const [groupId, setGroupId] = useState(data.groups[0]?.id);
  const isGroupMsg = type === "announcement";
  const student = data.studentById(studentId);
  const group = data.groupById(groupId);
  const [message, setMessage] = useState("");

  useEffect(() => {
    setMessage(buildMessage(type, t, student, group));
    // eslint-disable-next-line
  }, [type, studentId, groupId, lang]);

  const phone = isGroupMsg ? null : student?.parentPhone;

  function openWhatsapp() {
    const num = (phone || "").replace(/[^0-9]/g, "");
    const url = "https://wa.me/2" + num + "?text=" + encodeURIComponent(message);
    window.open(url, "_blank", "noopener");
  }

  return (
    <div className="screen">
      <div className="screen-head">
        <div><h1>{t("comm_title")}</h1><p className="screen-sub">{t("comm_sub")}</p></div>
      </div>

                {data.groups.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}

              <Select label={t("comm_pick_student")} value={studentId} onChange={(e) => setStudentId(e.target.value)}>
                {data.students.map((s) => <option key={s.id} value={s.id}>{s.firstName} {s.lastName}</option>)}

          {!isGroupMsg && phone && <p className="cell-muted mt8" dir="ltr">{phone}</p>}

function SettingsScreen() {
  const { t } = useLang();
  const data = useData();
  const toast = useToast();
  const [tab, setTab] = useState("general");
  const [teacherName, setTeacherName] = useState(data.teacherName);
  const [atRisk, setAtRisk] = useState(data.thresholds.atRisk);
  const [inactive, setInactive] = useState(data.thresholds.inactive);
  const fileInput = useRef(null);
  const restoreInput = useRef(null);

  function save() {
    data.setTeacherName(teacherName);
    data.setThresholds({ atRisk: Number(atRisk), inactive: Number(inactive) });
    toast(t("settings_saved"));
  }

  function download(name, content, type) {
    const blob = new Blob([content], { type: type || "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
  }

  function downloadBackup() {
    const payload = {
      students: data.students, groups: data.groups, sessions: data.sessions, attendance: data.attendance,
      homework: data.homework, quizzes: data.quizzes, exams: data.exams, meetings: data.meetings,
      files: data.files, team: data.team, audit: data.audit, thresholds: data.thresholds, teacherName: data.teacherName,
    };
    download("madar-backup-" + todayISO() + ".json", JSON.stringify(payload, null, 2));
    toast(t("toast_saved"));
  }

  function exportStudentsCsv() {
    const header = "name,phone,parentPhone,groupName,attendancePct,quizAvg\n";
    const rows = data.students.map((s) => {
      const g = data.groupById(s.groupId);
      return [s.firstName + " " + s.lastName, s.phone, s.parentPhone, g ? g.name : "", s.attendancePct, s.quizAvg]
        .map((v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"').join(",");
    }).join("\n");
    download("madar-students-" + todayISO() + ".csv", header + rows, "text/csv");
    toast(t("toast_saved"));
  }

  function onCsvChosen(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const text = String(reader.result || "");
        const lines = text.split(/\r?\n/).filter((l) => l.trim().length);
        if (lines.length < 2) { toast(t("import_error")); return; }
        const header = lines[0].split(",").map((h) => h.trim().toLowerCase().replace(/^"|"$/g, ""));
        const idx = (k) => header.indexOf(k);
        const rows = lines.slice(1).map((line) => {
          const cells = line.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map((c) => c.replace(/,$/, "").replace(/^"|"$/g, "").replace(/""/g, '"'));
          return { name: cells[idx("name")] || "", phone: cells[idx("phone")] || "", parentPhone: cells[idx("parentphone")] || "", groupName: cells[idx("groupname")] || "" };
        }).filter((r) => r.name);
        const n = data.importStudents(rows);
        toast(t("import_done") + " (" + n + ")");
      } catch (err) { toast(t("import_error")); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function onRestoreChosen(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(String(reader.result || "{}"));
        data.restoreState(obj);
        toast(t("backup_done"));
      } catch (err) { toast(t("import_error")); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  return (
    <div className="screen">
      <div className="screen-head"><div><h1>{t("settings_title")}</h1></div></div>
      <Tabs
        tabs={[
          { key: "general", label: t("settings_tab_general") },
          { key: "data", label: t("settings_tab_data") },
          { key: "team", label: t("settings_tab_team") },
        ]}
        active={tab}
        onChange={setTab}
      />

      {tab === "general" && (
        <>
          <div className="settings-grid">
            <Card title={t("settings_teacher")}>
              <Input label={t("settings_teacher_name")} value={teacherName} onChange={(e) => setTeacherName(e.target.value)} />
            </Card>
            <Card title={t("settings_thresholds")}>
              <p className="cell-muted mt8">{t("settings_thresholds_sub")}</p>
              <Input label={t("settings_at_risk_after")} type="number" min="1" max="10" value={atRisk} onChange={(e) => setAtRisk(e.target.value)} />
              <Input label={t("settings_inactive_after")} type="number" min="1" max="10" value={inactive} onChange={(e) => setInactive(e.target.value)} />
            </Card>
            <Card title={t("settings_language")}>
              <LangSwitch />
            </Card>
          </div>
          <Button className="mt16" onClick={save}>{t("settings_save")}</Button>
        </>
      )}

      {tab === "data" && (
        <div className="settings-grid">
          <Card title={t("backup_title")}>
            <p className="cell-muted mt8">{t("backup_sub")}</p>
            <div className="mt16" style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <Button variant="secondary" icon={I("download", { size: 15 })} onClick={downloadBackup}>{t("backup_export")}</Button>
              <Button variant="secondary" icon={I("file", { size: 15 })} onClick={() => restoreInput.current && restoreInput.current.click()}>{t("backup_import")}</Button>
              <p className="cell-muted" style={{ fontSize: 12 }}>{t("backup_restore_hint")}</p>
              <input ref={restoreInput} type="file" accept="application/json" style={{ display: "none" }} onChange={onRestoreChosen} />
            </div>
          </Card>
          <Card title={t("import_export_title")}>
            <p className="cell-muted mt8">{t("import_students_hint")}</p>
            <div className="mt16" style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <Button variant="secondary" icon={I("plus", { size: 15 })} onClick={() => fileInput.current && fileInput.current.click()}>{t("import_students")}</Button>
              <Button variant="secondary" icon={I("download", { size: 15 })} onClick={exportStudentsCsv}>{t("export_students")}</Button>
              <input ref={fileInput} type="file" accept=".csv,text/csv" style={{ display: "none" }} onChange={onCsvChosen} />
            </div>
          </Card>
          <Card title={t("permissions_title")}>
            <p className="cell-muted mt8">{t("permissions_sub")}</p>
          </Card>
        </div>
      )}

      {tab === "team" && <TeamScreen embedded />}
    </div>
  );
}
